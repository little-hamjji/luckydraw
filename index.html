<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모두의축제 럭키드로우</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 남색 밤하늘 위 유리 패널(조작판·순위·당첨 카드), 무대 코스와 구슬은 네온. 프로젝터 송출용 단일 다크 무대 */
:root{
  color-scheme: dark;
  --bg:#12172b;                         /* 바탕 */
  --glass:rgba(255,255,255,.06);        /* 유리 면 */
  --glass-hi:rgba(255,255,255,.10);
  --edge:rgba(255,255,255,.14);         /* 유리 테두리 */
  --text:#eef1ff;
  --muted:#a3abd0;
  --cyan:#3ff0ff;                       /* 네온 강조 */
  --pink:#ff4fd8;                       /* 회전 막대 */
  --gold:#ffd166;                       /* 당첨 */
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--body);position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(38vmax 38vmax at 8% 12%,rgba(255,79,216,.20),transparent 70%),
             radial-gradient(42vmax 42vmax at 92% 85%,rgba(63,240,255,.16),transparent 70%),
             radial-gradient(30vmax 30vmax at 70% 10%,rgba(124,92,255,.16),transparent 70%)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:16px;min-height:100%}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr)}.stage-col{order:-1}}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
h1{font:400 clamp(34px,3.8vw,52px)/1.15 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 0 14px rgba(63,240,255,.55),0 0 38px rgba(63,240,255,.3)}
.panel{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;align-self:start}
.field{display:flex;flex-direction:column;gap:6px}
label,.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=number],textarea{width:100%;background:rgba(10,14,30,.45);color:var(--text);border:1px solid var(--edge);border-radius:10px;padding:9px 11px;font:15px/1.5 var(--body)}
textarea{min-height:200px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint code{background:rgba(10,14,30,.5);padding:1px 5px;border-radius:4px;color:var(--text)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--text)}
.warn{color:var(--pink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:rgba(10,14,30,.3)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{background:transparent;border:0;color:var(--muted);padding:9px 6px;font:500 14px var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--edge)}
.seg button[aria-pressed=true]{background:var(--glass-hi);color:var(--cyan);font-weight:700;text-shadow:0 0 10px rgba(63,240,255,.6)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.btn{border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:10px;padding:10px 14px;font:500 14px var(--body);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btn:hover{background:var(--glass-hi)}
.btn.go{background:rgba(63,240,255,.14);border-color:rgba(63,240,255,.7);color:var(--cyan);font:400 20px var(--display);padding:12px;text-shadow:0 0 12px rgba(63,240,255,.8);box-shadow:0 0 22px rgba(63,240,255,.25),inset 0 0 18px rgba(63,240,255,.12)}
.btn.go:hover{background:rgba(63,240,255,.22)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.history{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.history .item{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:10px;border-top:1px solid var(--edge);padding-top:6px}
.history .no{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
.history .empty{font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--muted);font:12px var(--body);text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}

.stage-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage-head .sub{font-size:13px;color:var(--muted);margin-top:4px}
.stage{position:relative;height:min(84vh,940px);min-height:460px;border-radius:20px;overflow:hidden;background:var(--bg)}
.stage:fullscreen{height:100%;border-radius:0}
canvas#world{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.live{position:absolute;top:12px;right:12px;bottom:72px;border-radius:14px;padding:10px 12px;width:200px;max-width:42%;font-size:13px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.live ol{overflow:auto;flex:1;min-height:0;scrollbar-width:thin}
.live li .n{color:var(--c);text-shadow:0 0 8px var(--c)}
.live li.top .r,.live li.won .r{color:var(--text);font-weight:700}
.live li.won .n{font-weight:700}
.live li.fin{opacity:.75}
.live li .r{display:inline-block;min-width:2.4em;color:var(--muted)}
.found{position:absolute;top:12px;left:12px;border-radius:999px;padding:5px 10px;display:flex;gap:4px;align-items:center;z-index:3}
.found span{font-size:12px;color:var(--muted);margin-right:4px}
.found img{height:26px;width:auto;filter:grayscale(1) brightness(.5);opacity:.45;transition:filter .3s,opacity .3s,transform .3s}
.found img.on{filter:none;opacity:1;transform:scale(1.15)}
.live .lbl{display:block;margin-bottom:4px}
.live ol{margin:0;padding:0;list-style:none}
.live li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live li.won{font-weight:700}
.zoom{position:absolute;left:12px;bottom:12px;border-radius:999px;padding:4px;display:flex;align-items:center;gap:2px}
.zoom button{background:transparent;border:0;color:var(--text);font:500 14px var(--body);min-width:36px;height:34px;border-radius:999px;cursor:pointer;padding:0 10px}
.zoom button:hover{background:var(--glass-hi)}
.zoom button[aria-pressed=true]{color:var(--cyan);text-shadow:0 0 10px rgba(63,240,255,.7)}
.zoom input[type=range]{width:120px;accent-color:var(--cyan)}
@media (max-width:520px){.zoom input[type=range]{width:70px}}
.zoom output{min-width:48px;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,13,28,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
.overlay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{position:relative;border-radius:22px;padding:26px 28px;max-width:540px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;border-color:rgba(255,209,102,.55)!important;box-shadow:0 0 50px rgba(255,209,102,.18),0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)!important}
.card .eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0}
.card h2{font:400 26px var(--display);margin:0;color:var(--gold);text-shadow:0 0 16px rgba(255,209,102,.6)}
.winners{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.winners li{font:400 clamp(28px,5vw,48px)/1.2 var(--display);overflow-wrap:anywhere;text-shadow:0 0 22px rgba(63,240,255,.55)}
.winners li small{font:500 14px var(--body);color:var(--muted);margin-right:10px;vertical-align:middle;text-shadow:none}
.card .row .btn{flex:1 1 140px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="panel glass" aria-label="추첨 설정">
    <div class="field">
      <label for="title">행사 이름</label>
      <input id="title" type="text" value="모두의축제 럭키드로우">
    </div>
    <div class="field">
      <label for="names">참가자 명단</label>
      <textarea id="names" spellcheck="false"></textarea>
      <p class="hint">한 줄에 한 명씩, 쉼표로 구분해도 됩니다. <code>이름*3</code>처럼 쓰면 구슬이 3개가 되어 당첨 확률이 3배가 됩니다.</p>
      <div class="count" id="count"></div>
    </div>
    <div class="field">
      <span class="lbl">당첨 방식</span>
      <div class="seg" role="group" aria-label="당첨 방식">
        <button id="mFirst" type="button" aria-pressed="true">먼저 도착</button>
        <button id="mLast" type="button" aria-pressed="false">끝까지 남음</button>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="winN">당첨 인원</label>
        <input id="winN" type="number" min="1" max="20" value="1">
      </div>
      <div class="field">
        <span class="lbl">속도</span>
        <div class="seg three" role="group" aria-label="속도">
          <button type="button" data-sp="1" aria-pressed="true">1×</button>
          <button type="button" data-sp="2" aria-pressed="false">2×</button>
          <button type="button" data-sp="3" aria-pressed="false">3×</button>
        </div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="shuffle" type="button">자리 섞기</button>
      <button class="btn" id="full" type="button">전체 화면</button>
    </div>
    <button class="btn go" id="start" type="button">추첨 시작</button>
    <p class="hint">스페이스바로도 시작할 수 있습니다. 코스 위에서 마우스 휠이나 두 손가락으로 확대·축소합니다.</p>
    <div class="field">
      <span class="lbl">추첨 기록</span>
      <div class="history" id="history"></div>
      <button class="linkbtn" id="clearHist" type="button">기록 지우기</button>
    </div>
  </aside>

  <section class="stage-col">
    <div class="stage-head">
      <h1 id="stageTitle">모두의축제 럭키드로우</h1>
      <div class="sub" id="stageSub"></div>
    </div>
    <div class="stage glass" id="stage">
      <canvas id="world"></canvas>
      <div class="found glass" id="found" aria-label="찾은 캐릭터"><span>숨은 친구</span></div>
      <div class="live glass" id="live"><span class="lbl">실시간 순위</span><ol id="liveList"></ol></div>
      <div class="zoom glass" role="group" aria-label="확대·축소">
        <button id="zOut" type="button" aria-label="축소">−</button>
        <input id="zRange" type="range" min="0" max="100" step="1" aria-label="확대·축소 정도">
        <button id="zIn" type="button" aria-label="확대">+</button>
        <output id="zVal">100%</output>
        <button id="zFit" type="button" aria-pressed="false">전체 보기</button>
      </div>
      <div class="overlay" id="overlay" hidden>
        <canvas id="confetti"></canvas>
        <div class="card glass" role="dialog" aria-labelledby="winTitle">
          <p class="eyebrow" id="winMeta"></p>
          <h2 id="winTitle">축하합니다!</h2>
          <ol class="winners" id="winList"></ol>
          <div class="row">
            <button class="btn go" id="next" type="button" style="font-size:16px">당첨자 빼고 다음 추첨</button>
            <button class="btn" id="again" type="button">명단 그대로 다시</button>
          </div>
          <button class="linkbtn" id="closeWin" type="button" style="align-self:center">닫고 코스 보기</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 코스(맵) ---------- */
const W=420,R=9,GRAV=980,MAXV=900,GAP=20;
let H=0,GOAL=0;
const segs=[],pegs=[],spins=[];
const S=(x1,y1,x2,y2)=>segs.push({x1,y1,x2,y2});
const P=(x,y,r,b)=>pegs.push({x,y,r,b:!!b});
const SP=(cx,cy,len,w)=>spins.push({cx,cy,len,w,a:Math.random()*Math.PI,x1:0,y1:0,x2:0,y2:0});
function pegField(y0,y1,bumpers){
  bumpers.forEach(b=>P(b[0],b[1],12,1));
  for(let row=0,y=y0;y<=y1;row++,y+=42){
    for(let x=row%2?46:23;x<=W-20;x+=46){
      if(bumpers.some(b=>Math.hypot(b[0]-x,b[1]-y)<40))continue;
      P(x,y,4.5,0);
    }
  }
}
// 구간을 위에서 아래로 쌓아 코스를 만든다. 각 함수는 다음 구간이 시작할 y를 돌려준다
const funnel=(y,open,dir=1)=>{S(0,y,W/2-open/2,y+80);S(W,y,W/2+open/2,y+80);SP(W/2,y+150,130,2.6*dir);return y+230};
const pegs_=(y,h,b)=>{pegField(y,y+h,b.map(([x,dy])=>[x,y+dy]));return y+h+40};
function zigzag(y,n,flip){for(let i=0;i<n;i++){((i+flip)%2)?S(W,y,75,y+50):S(0,y,345,y+50);y+=120}return y+20}
function spinRow(y,dir){SP(80,y,100,3*dir);SP(210,y,100,-3.4*dir);SP(340,y,100,3*dir);return y+110}
function garden(y,rows){for(let r=0;r<rows;r++)for(let x=r%2?70:35;x<=W-30;x+=70)P(x,y+r*62,12,1);return y+rows*62+20}
function lanes(y,h){S(140,y,140,y+h);S(280,y,280,y+h);
  for(let yy=y+40;yy<y+h-20;yy+=46)for(const x0 of [0,140,280]){const o=((yy-y)/46|0)%2?47:23;for(let x=x0+o;x<x0+140-25;x+=47)P(x,yy,4.5,0)}
  return y+h+50}
const START=900,BK=60;let buckets=[];
(function build(){
  let y=START;
  for(let rep=0;rep<3;rep++){
    const d=rep%2?-1:1;
    y=pegs_(y,420,[[105,210],[315,210],[210,340]]);
    y=funnel(y,70,d);
    y=zigzag(y,4,rep%2);
    y=spinRow(y,d);
    y=pegs_(y,300,[[210,150]]);
    y=garden(y,4);
    y=funnel(y,80,-d);
    y=lanes(y,520);
    y=zigzag(y,4,(rep+1)%2);
    y=spinRow(y,-d);y=spinRow(y,d);
    y=pegs_(y,340,[[80,170],[340,170],[210,90],[210,260]]);
    y=funnel(y,70,d);
    y=garden(y,3);
    y=zigzag(y,3,rep%2);
    y=pegs_(y,300,[[210,150]]);
  }
  S(0,y,180,y+130);S(W,y,240,y+130);              // 최종 깔때기
  SP(210,y+80,56,4.5);
  S(180,y+130,180,y+200);S(240,y+130,240,y+200);
  GOAL=y+240;H=GOAL+90;
  S(0,0,0,H);S(W,0,W,H);
  // 구슬은 자기 y구간 버킷의 장애물만 검사한다 (코스가 길어도 느려지지 않게)
  const n=Math.ceil(H/BK)+1;buckets=Array.from({length:n},()=>({s:[],p:[],r:[]}));
  const add=(o,y0,y1,k)=>{const a=Math.max(0,Math.floor((y0-40)/BK)),b=Math.min(n-1,Math.floor((y1+40)/BK));for(let i=a;i<=b;i++)buckets[i][k].push(o)};
  segs.forEach(o=>add(o,Math.min(o.y1,o.y2),Math.max(o.y1,o.y2),'s'));
  pegs.forEach(o=>add(o,o.y-o.r,o.y+o.r,'p'));
  spins.forEach(o=>add(o,o.cy-o.len/2,o.cy+o.len/2,'r'));
})();

/* ---------- 상태 ---------- */
let marbles=[],finishOrder=[],winners=[],state='ready',mode=store.get('ld_mode','first'),speed=1;
let zView=1,camY=0,camX=0,round=0,history=store.get('ld_hist',[]),frame=0,zoom=store.get('ld_zoom',1),fit=false;
const elNames=$('#names'),elTitle=$('#title'),elWinN=$('#winN');
const sample=['김하늘','이준호','박서연','최민재','정다은','강도윤','조유진','윤시우','장하린','임지호','한서준','오예린','서지안','신우진','권나윤','황민서','안태오','송채원','전도현','홍수아','유은찬','고지유','문하준','양소율'];
elNames.value=store.get('ld_names',sample.join('\n'));
elTitle.value=store.get('ld_title','모두의축제 럭키드로우');
elWinN.value=store.get('ld_winN',1);

// 줄바꿈·쉼표·세미콜론·탭(엑셀에서 복사) 모두 구분자. 같은 이름은 합치지 않고 (2),(3)을 붙여 따로 참가시킨다
function parse(text){
  const seen=new Map(),out=[];
  text.split(/[\n,;\t]+/).forEach(raw=>{
    raw=raw.trim();if(!raw)return;
    let s=raw,w=1;const m=s.match(/^(.*?)\s*\*\s*(\d+)$/);
    if(m){s=m[1].trim();w=Math.max(1,Math.min(20,+m[2]))}
    if(!s)return;
    const c=(seen.get(s)||0)+1;seen.set(s,c);
    out.push({name:c>1?`${s}(${c})`:s,w,raw,dup:c>1});
  });
  return out;
}
const hue=i=>(i*137.508+190)%360;

function spawn(){
  const list=parse(elNames.value);
  marbles=[];
  list.forEach((p,i)=>{const h=hue(i);for(let k=0;k<p.w;k++)marbles.push({name:p.name,h,x:0,y:0,vx:0,vy:0,r:R,done:false,still:0})});
  const per=8,slots=[];
  for(let k=0;k<marbles.length;k++)slots.push(k);
  for(let k=slots.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[slots[k],slots[j]]=[slots[j],slots[k]]}
  marbles.forEach((m,k)=>{const s=slots[k],row=s/per|0,col=s%per;m.x=28+col*50+(row%2?22:0)+(Math.random()*2-1);m.y=40+row*34});
  finishOrder=[];winners=[];state='ready';camY=0;zView=zoom;
  if(typeof crit!=='undefined')hideCrit();
  updateCount(list);renderLive();
}
function updateCount(list){
  list=list||parse(elNames.value);
  const n=list.length,m=list.reduce((a,p)=>a+p.w,0);
  const over=m>200;
  const dup=list.filter(p=>p.dup).length;
  $('#count').innerHTML=`참가 <b>${n}</b>명 · 구슬 <b>${m}</b>개`+(dup?` · 같은 이름 ${dup}명은 (2),(3)으로 구분`:'')+(over?` <span class="warn">구슬은 200개까지 가능합니다</span>`:'');
  $('#start').disabled=over||n===0||state==='run';
  const k=winCount();
  $('#stageSub').textContent=`제 ${round+1}회 추첨 · ${mode==='first'?'먼저 도착한':'끝까지 남은'} ${k}명 당첨 · 참가 ${n}명`;
}
const winCount=()=>Math.max(1,Math.min(20,parseInt(elWinN.value)||1));

/* ---------- 물리 ---------- */
function resolve(m,qx,qy,th,e,sp){
  let nx=m.x-qx,ny=m.y-qy;const rr=m.r+th,d2=nx*nx+ny*ny;
  if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||1e-4;nx/=d;ny/=d;
  m.x=qx+nx*rr;m.y=qy+ny*rr;
  let svx=0,svy=0;if(sp){svx=-sp.w*(qy-sp.cy);svy=sp.w*(qx-sp.cx)}
  let rvx=m.vx-svx,rvy=m.vy-svy;const vn=rvx*nx+rvy*ny;
  if(vn<0){rvx-=(1+e)*vn*nx;rvy-=(1+e)*vn*ny}
  m.vx=rvx*.998+svx;m.vy=rvy*.998+svy;
}
function seg(m,x1,y1,x2,y2,th,e,sp){
  const dx=x2-x1,dy=y2-y1;let t=((m.x-x1)*dx+(m.y-y1)*dy)/(dx*dx+dy*dy);t=t<0?0:t>1?1:t;
  resolve(m,x1+t*dx,y1+t*dy,th,e,sp);
}
function step(dt){
  for(const s of spins){s.a+=s.w*dt;const c=Math.cos(s.a)*s.len/2,n=Math.sin(s.a)*s.len/2;s.x1=s.cx-c;s.y1=s.cy-n;s.x2=s.cx+c;s.y2=s.cy+n}
  const act=marbles.filter(m=>!m.done);
  for(const m of act){
    m.vy+=GRAV*dt;
    const v=Math.hypot(m.vx,m.vy);if(v>MAXV){m.vx*=MAXV/v;m.vy*=MAXV/v}
    m.x+=m.vx*dt;m.y+=m.vy*dt;
  }
  for(let i=0;i<act.length;i++){const a=act[i];
    for(let j=i+1;j<act.length;j++){const b=act[j];
      let dx=b.x-a.x,dy=b.y-a.y;const d2=dx*dx+dy*dy,rr=a.r+b.r;
      if(d2>=rr*rr||d2===0)continue;
      const d=Math.sqrt(d2);dx/=d;dy/=d;const o=(rr-d)/2;
      a.x-=dx*o;a.y-=dy*o;b.x+=dx*o;b.y+=dy*o;
      const vr=(b.vx-a.vx)*dx+(b.vy-a.vy)*dy;
      if(vr<0){const j2=-(1.3)*vr/2;a.vx-=j2*dx;a.vy-=j2*dy;b.vx+=j2*dx;b.vy+=j2*dy}
    }}
  for(const m of act){
    const bk=buckets[Math.max(0,Math.min(buckets.length-1,Math.floor(m.y/BK)))];
    for(const s of bk.s)seg(m,s.x1,s.y1,s.x2,s.y2,3,.4,null);
    for(const s of bk.r)seg(m,s.x1,s.y1,s.x2,s.y2,4,.5,s);
    for(const p of bk.p)resolve(m,p.x,p.y,p.r,p.b?1.15:.45,null);
    // 끼임 방지: 오래 멈춰 있으면 살짝 튕겨 줌
    if(Math.hypot(m.vx,m.vy)<18){m.still+=dt;if(m.still>1.2){m.vy-=160+Math.random()*120;m.vx+=(Math.random()*2-1)*140;m.still=0}}else m.still=0;
    if(m.y>GOAL){m.done=true;finishOrder.push(m)}
  }
}
function judge(){
  const k=winCount();
  if(mode==='first'){
    const seen=new Set(),w=[];
    for(const m of finishOrder){if(!seen.has(m.name)){seen.add(m.name);w.push(m)}if(w.length===k)break}
    const total=new Set(marbles.map(m=>m.name)).size;
    if(w.length>=Math.min(k,total))return w.map(m=>m.name);
  }else{
    const alive=[...new Set(marbles.filter(m=>!m.done).map(m=>m.name))];
    if(alive.length<=k){
      const out=[...alive];
      for(let i=finishOrder.length-1;i>=0&&out.length<k;i--){const n=finishOrder[i].name;if(!out.includes(n))out.push(n)}
      return out;
    }
  }
  return null;
}

/* ---------- 그리기 ---------- */
const cv=$('#world'),ctx=cv.getContext('2d');let dpr=1,scale=1,base=1,cw=0,ch=0,courseL=0,courseR=0;
function resize(){
  const st=$('#stage').getBoundingClientRect();
  cw=st.width;ch=st.height;dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  base=Math.min(cw,ch*.8)/W;applyZoom();
}
new ResizeObserver(resize).observe($('#stage'));
const ZMAX=2.4;
const zMin=()=>Math.min(1,(ch-24)/(H+80)/base);
function applyZoom(){
  if(fit)zoom=zMin();
  zoom=Math.max(zMin(),Math.min(ZMAX,zoom));
  if(state==='ready'||fit)zView=zoom;
  scale=base*zView;
  $('#zVal').textContent=Math.round(zoom*100)+'%';
  $('#zFit').setAttribute('aria-pressed',fit);
  $('#zRange').value=Math.round(100*Math.log(zoom/zMin())/Math.log(ZMAX/zMin()));
}
function setZoom(z){fit=false;zoom=z;applyZoom();store.set('ld_zoom',zoom)}
const viewH=()=>ch/scale,viewW=()=>cw/scale;

// 네온 구슬: 색마다 한 번만 그려 두고 재사용
const SPR=3,PAD=14,sprites=new Map();
function sprite(h){
  if(sprites.has(h))return sprites.get(h);
  const size=(R+PAD)*2*SPR,c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d'),o=size/2,col=`hsl(${h} 100% 62%)`;
  x.shadowColor=col;x.shadowBlur=12*SPR;
  x.beginPath();x.arc(o,o,R*SPR,0,7);x.fillStyle=`hsla(${h},100%,60%,.28)`;x.fill();
  x.lineWidth=3.2*SPR;x.strokeStyle=col;x.stroke();x.stroke();
  x.shadowBlur=0;x.lineWidth=1.1*SPR;x.strokeStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(o,o,R*SPR,0,7);x.stroke();
  x.beginPath();x.arc(o-3*SPR,o-3*SPR,1.8*SPR,0,7);x.fillStyle='rgba(255,255,255,.85)';x.fill();
  sprites.set(h,c);return c;
}
function ranked(){
  const act=marbles.filter(m=>!m.done).sort((a,b)=>b.y-a.y);
  return [...finishOrder,...act];
}
function neonLine(list,color,w,glow){
  ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=glow*dpr;ctx.strokeStyle=color;ctx.lineWidth=w;
  ctx.beginPath();for(const s of list){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2)}ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=w*.3;ctx.stroke();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#12172b';ctx.fillRect(0,0,cw,ch);
  const offX=W*scale<cw?(cw-W*scale)/2:0;courseL=offX-camX*scale;courseR=courseL+W*scale;
  const k=dpr*scale;ctx.setTransform(k,0,0,k,dpr*offX-camX*k,-camY*k);
  // 코스 바닥 (유리 판)
  ctx.fillStyle='rgba(255,255,255,.035)';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(163,171,208,.07)';ctx.lineWidth=1;ctx.beginPath();
  for(let y=100;y<H;y+=100){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  // 결승선
  const cs=10;for(let x=0;x<W;x+=cs)for(let r=0;r<2;r++){ctx.fillStyle=((x/cs+r)%2)?'rgba(238,241,255,.85)':'rgba(18,23,43,.9)';ctx.fillRect(x,GOAL+r*cs,cs,cs)}
  ctx.textAlign='center';ctx.font='400 28px "Do Hyeon",sans-serif';
  ctx.shadowColor='#ffd166';ctx.shadowBlur=14*dpr;ctx.fillStyle='#ffd166';ctx.fillText('FINISH',W/2,GOAL+52);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(238,241,255,.55)';ctx.font='500 13px "IBM Plex Sans KR",sans-serif';ctx.fillText('출발',W/2,20);
  // 벽·선반·핀·회전 막대 (네온)
  const vy0=camY-80,vy1=camY+viewH()+80,vis=o=>Math.max(o.y1,o.y2)>vy0&&Math.min(o.y1,o.y2)<vy1;
  neonLine(segs.filter(vis),'#8fa2ff',5,10);
  for(const p of pegs){if(p.y<vy0||p.y>vy1)continue;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
    if(p.b){ctx.shadowColor='#ffd166';ctx.shadowBlur=14*dpr;ctx.lineWidth=3;ctx.strokeStyle='#ffd166';ctx.stroke();ctx.shadowBlur=0}
    else{ctx.fillStyle='rgba(200,210,255,.75)';ctx.fill()}
  }
  for(const s of spins){if(s.cy<vy0-80||s.cy>vy1+80)continue;neonLine([s],'#ff4fd8',7,16);ctx.beginPath();ctx.arc(s.cx,s.cy,4,0,7);ctx.fillStyle='#fff';ctx.fill()}
  drawCrit();
  // 구슬
  const rk=ranked(),act=rk.filter(m=>!m.done);
  const half=R+PAD;
  for(const m of act)ctx.drawImage(sprite(m.h),m.x-half,m.y-half,half*2,half*2);
  // 이름표: 모든 구슬에 표시. 1~5위는 금색 테두리와 순위를 붙여 맨 위에 그린다
  const fs=12.5*Math.min(1.3,Math.max(.95,zView))/scale;
  const fmap=new Map(focus.map(f=>[f.m,f.rank]));
  ctx.font=`700 ${fs}px "IBM Plex Sans KR",sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';
  const label=(m,txt,fill)=>{const ty=m.y+R+fs*1.05;ctx.lineWidth=fs*.32;ctx.strokeStyle='rgba(18,23,43,.92)';ctx.strokeText(txt,m.x,ty);ctx.fillStyle=fill;ctx.fillText(txt,m.x,ty)};
  for(const m of act){if(m.y<vy0||m.y>vy1||fmap.has(m))continue;label(m,m.name,'#eef1ff')}
  for(const [m,r] of fmap){
    ctx.beginPath();ctx.arc(m.x,m.y,R+4/scale+2,0,7);ctx.lineWidth=2.5/scale+.5;ctx.strokeStyle=`hsl(${m.h} 100% 70%)`;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=10*dpr;ctx.stroke();ctx.shadowBlur=0;
    label(m,`${r}등 ${m.name}`,'#eef1ff');
  }
  // 오른쪽 진행 막대
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const bx=cw-10,top=14,bh=ch-28;
  ctx.fillStyle='rgba(163,171,208,.18)';ctx.fillRect(bx-2,top,4,bh);
  ctx.fillStyle='rgba(238,241,255,.22)';ctx.fillRect(bx-5,top+Math.max(0,camY)/H*bh,10,Math.min(1,viewH()/H)*bh);
  for(const m of act){ctx.fillStyle=`hsl(${m.h} 100% 62%)`;ctx.fillRect(bx-3,top+Math.min(1,m.y/GOAL)*bh-1,6,2)}
}
// 당첨 순위 1~5위 구슬 (먼저 도착: 아래쪽부터 / 끝까지 남음: 위쪽부터), 이름 중복 없이
function focusSet(){
  const act=marbles.filter(m=>!m.done).sort((a,b)=>mode==='first'?b.y-a.y:a.y-b.y);
  const seen=new Set(finishOrder.map(m=>m.name)),out=[];
  let rank=mode==='first'?seen.size:0;
  if(mode==='last'){seen.clear()}
  for(const m of act){if(seen.has(m.name))continue;seen.add(m.name);out.push({m,rank:++rank});if(out.length===5)break}
  return out;
}
let focus=[];
function follow(){
  focus=state==='ready'?[]:focusSet();
  // 1~5위가 모두 화면에 들어오도록 필요하면 자동으로 축소 (사용자 배율이 상한)
  if(fit)zView=zMin();
  else if(focus.length){
    const ys=focus.map(f=>f.m.y),span=Math.max(...ys)-Math.min(...ys)+170;
    const want=Math.max(zMin(),Math.min(zoom,ch/(span*1.2)/base));
    zView+=(want-zView)*.06;
  }else zView+=(zoom-zView)*.1;
  scale=base*zView;
  const vh=viewH(),vw=viewW();
  let ty,tx=W/2;
  if(state==='ready'||!focus.length)ty=0;
  else{
    const ys=focus.map(f=>f.m.y);
    ty=(Math.max(...ys)+Math.min(...ys))/2-vh*(mode==='first'?.45:.55);
    tx=focus.reduce((a,f)=>a+f.m.x,0)/focus.length;
  }
  ty=vh>=H+80?(H-vh)/2+20:Math.max(0,Math.min(H+60-vh,ty));
  tx=vw>=W?0:Math.max(0,Math.min(W-vw,tx-vw/2));
  camY+=(ty-camY)*Math.min(1,.12*speed);camX+=(tx-camX)*.12;
  // 1~5위는 어떤 속도에서도 화면 밖으로 나가지 않게 고정
  if(focus.length&&vh<H){const ys=focus.map(f=>f.m.y),lo=Math.min(...ys)-60,hi=Math.max(...ys)+90;
    if(hi-lo<vh){if(hi>camY+vh)camY=hi-vh;if(lo<camY)camY=lo}else camY=hi-vh}
}
function renderLive(){
  // 전원 순위: 이미 도착한 사람 → 코스 위 순서. 끝까지 남음 모드는 역순(늦은 사람이 위)
  const rk=ranked();const won=new Set(winners),top=new Set(focus.map(f=>f.m.name));
  let list=mode==='first'?rk:[...rk].reverse();
  const seen=new Set(),out=[];
  for(const m of list){if(seen.has(m.name))continue;seen.add(m.name);out.push(m)}
  $('#live .lbl').textContent=(mode==='first'?'실시간 순위':'실시간 순위 (늦은 순)')+` · ${out.length}명`;
  $('#liveList').innerHTML=out.map((m,i)=>`<li class="${won.has(m.name)?'won':top.has(m.name)?'top':m.done?'fin':''}"><span class="r">${i+1}</span><span class="n" style="--c:hsl(${m.h} 100% 68%)">${esc(m.name)}</span>${m.done&&mode==='first'?' ✓':''}</li>`).join('');
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 루프 ---------- */
let last=performance.now();
function loop(t){
  const dtF=Math.min(.05,(t-last)/1000);last=t;
  if(state==='run'){
    const n=Math.round(dtF*240)*speed;for(let i=0;i<n;i++)step(1/240);
    const w=judge();
    if(w){winners=w;state='done';setTimeout(showWin,700)}
  }
  walkC(dtF);follow();draw();
  if(++frame%8===0)renderLive();
  requestAnimationFrame(loop);
}

/* ---------- 당첨 ---------- */
function showWin(){
  round++;
  const k=winCount();
  history.unshift({no:round,names:winners,mode,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});
  store.set('ld_hist',history);store.set('ld_round',round);renderHist();
  $('#winMeta').textContent=`제 ${round}회 추첨 · ${mode==='first'?'먼저 도착':'끝까지 남음'} · ${k}명`;
  $('#winList').innerHTML=winners.map((n,i)=>`<li>${winners.length>1?`<small>${i+1}</small>`:''}${esc(n)}</li>`).join('');
  $('#overlay').hidden=false;confetti();updateCount();$('#start').textContent='새로 추첨';
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d'),r=c.getBoundingClientRect();
  c.width=r.width*dpr;c.height=r.height*dpr;x.scale(dpr,dpr);
  const cols=['#ffd166','#ff4fd8','#3ff0ff','#eef1ff','#9b8cff'];
  const ps=Array.from({length:160},()=>({x:r.width/2,y:r.height*.35,vx:(Math.random()*2-1)*7,vy:-Math.random()*9-3,s:Math.random()*6+4,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function tick(){x.clearRect(0,0,r.width,r.height);
    for(const p of ps){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.shadowColor=p.c;x.shadowBlur=8;x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}
    if(++f<200&&!$('#overlay').hidden)requestAnimationFrame(tick);else x.clearRect(0,0,r.width,r.height)})();
}
function renderHist(){
  const h=$('#history');
  h.innerHTML=history.length?history.map(e=>`<div class="item"><span class="no">${e.no}회</span><span>${e.names.map(esc).join(', ')} <span class="hint">· ${e.time}</span></span></div>`).join(''):'<div class="empty">아직 추첨 기록이 없습니다.</div>';
}

/* ---------- 조작 ---------- */
function start(){
  if(state==='run'||$('#start').disabled)return;
  if(state==='done'){$('#overlay').hidden=true;spawn()}
  state='run';$('#start').textContent='추첨 중…';$('#start').disabled=true;
}
function reset(){$('#overlay').hidden=true;spawn();$('#start').textContent='추첨 시작';updateCount()}
$('#start').onclick=start;
$('#shuffle').onclick=()=>{if(state!=='run')reset()};
$('#again').onclick=()=>{reset();start()};
$('#next').onclick=()=>{
  const out=new Set(winners);
  const keep=parse(elNames.value).filter(p=>!out.has(p.name)).map(p=>p.raw);
  elNames.value=keep.join('\n');store.set('ld_names',elNames.value);reset();
};
$('#closeWin').onclick=()=>{$('#overlay').hidden=true;$('#start').textContent='새로 추첨';$('#start').disabled=false};
elNames.oninput=()=>{store.set('ld_names',elNames.value);if(state!=='run')reset()};
elWinN.oninput=()=>{store.set('ld_winN',elWinN.value);updateCount()};
elTitle.oninput=()=>{store.set('ld_title',elTitle.value);$('#stageTitle').textContent=elTitle.value||'럭키드로우'};
function setMode(m){if(state==='run')return;mode=m;store.set('ld_mode',m);$('#mFirst').setAttribute('aria-pressed',m==='first');$('#mLast').setAttribute('aria-pressed',m==='last');updateCount();renderLive()}
$('#mFirst').onclick=()=>setMode('first');$('#mLast').onclick=()=>setMode('last');
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(o=>o.setAttribute('aria-pressed',o===b))});
$('#full').onclick=()=>{const s=$('#stage');try{(document.fullscreenElement?document.exitFullscreen():s.requestFullscreen()).catch(()=>{})}catch(e){}};
$('#clearHist').onclick=function(){
  if(this.dataset.arm){history=[];round=0;store.set('ld_hist',[]);store.set('ld_round',0);renderHist();updateCount();this.textContent='기록 지우기';delete this.dataset.arm}
  else{this.dataset.arm=1;this.textContent='한 번 더 누르면 기록이 지워집니다';setTimeout(()=>{delete this.dataset.arm;this.textContent='기록 지우기'},3000)}
};
// 확대·축소: 버튼, 마우스 휠, 두 손가락
$('#zIn').onclick=()=>setZoom(zoom*1.25);
$('#zOut').onclick=()=>setZoom(zoom/1.25);
$('#zRange').oninput=e=>setZoom(zMin()*Math.pow(ZMAX/zMin(),e.target.value/100));
$('#zFit').onclick=()=>{fit=!fit;if(!fit)zoom=1;applyZoom()};
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.0015))},{passive:false});
let pinch=null;
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){const[a,b]=e.touches;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z:zoom}}},{passive:true});
cv.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const[a,b]=e.touches;setZoom(pinch.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch.d)}},{passive:false});
cv.addEventListener('touchend',()=>{pinch=null});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();start()}
  if(e.key==='+'||e.key==='=')setZoom(zoom*1.25);
  if(e.key==='-')setZoom(zoom/1.25);

const NOOK=[.1,.28,.47,.66,.85];
const crit=CRITTERS.map((src,i)=>{const img=new Image();img.src=src;
  const th=document.createElement('img');th.src=src;th.alt='';$('#found').appendChild(th);
  return {img,th,i,side:i%2?1:-1,homeY:0,x:0,y:0,tx:0,ty:0,v:34+Math.random()*18,wait:0,dir:1,ph:Math.random()*6,walking:false,st:'hidden',t:0}});
const critH=()=>Math.max(38,22/scale);
const critW=c=>critH()*(c.img.naturalWidth?c.img.naturalWidth/c.img.naturalHeight:.85);
function hideCrit(){
  crit.forEach(c=>{c.homeY=START+NOOK[c.i]*(GOAL-START);c.st='hidden';c.t=0;c.y=c.homeY;c.th.classList.remove('on')});
}
function homeX(c){const w=critW(c);return c.side<0?-w*.62:W-w*.38}         // 벽 뒤에서 얼굴만 빼꼼
function pickC(c){const w=critW(c);c.tx=8+Math.random()*(W-16-w);c.ty=c.homeY-120+Math.random()*240}
function walkC(dt){
  const cheer=!$('#overlay').hidden,h=critH();
  // 선두(또는 집중 구간)가 다가오면 튀어나온다
  const front=focus.length?Math.max(...focus.map(f=>f.m.y)):-1e9;
  for(const c of crit){
    c.ph+=dt*(cheer?9:c.walking?13:3);
    if(c.st==='hidden'){c.x=homeX(c);c.y=c.homeY;
      if(state!=='ready'&&front>c.homeY-viewH()*.55){c.st='pop';c.t=0;c.dir=-c.side;c.th.classList.add('on');pickC(c);c.tx=c.side<0?20:W-20-critW(c);c.ty=c.homeY}
      continue}
    if(c.st==='pop'){c.t+=dt;const k=Math.min(1,c.t/.7),e=1-Math.pow(1-k,3);
      c.x=homeX(c)+(c.tx-homeX(c))*e;c.y=c.homeY-Math.sin(k*Math.PI)*h*1.2;
      if(k>=1){c.st='out';c.y=c.homeY;c.wait=.4;pickC(c)}continue}
    if(cheer){c.walking=false;continue}
    if(c.wait>0){c.wait-=dt;c.walking=false;continue}
    const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
    if(d<2){c.wait=.4+Math.random()*1.8;pickC(c);continue}
    const sp=Math.min(d,c.v*(h/38)*dt);c.x+=dx/d*sp;c.y+=dy/d*sp;c.dir=dx<0?-1:1;c.walking=true;
  }
}
function drawCrit(){
  const cheer=!$('#overlay').hidden,h=critH(),vy0=camY-h*2,vy1=camY+viewH()+h;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();          // 벽 바깥은 가려져서 '숨은' 모습
  for(const c of crit){
    if(!c.img.complete||c.y<vy0||c.y>vy1)continue;
    const w=critW(c);
    let bob=0,rot=0;
    if(c.st==='hidden'){rot=Math.sin(c.ph)*.12*-c.side}
    else if(cheer&&c.st==='out'){bob=-Math.abs(Math.sin(c.ph))*h*.4}
    else if(c.walking){bob=-Math.abs(Math.sin(c.ph))*h*.07;rot=Math.sin(c.ph)*.1}
    if(c.st==='pop'){const k=Math.min(1,c.t/.7);ctx.beginPath();ctx.arc(c.x+w/2,c.y+h/2,h*(.6+k*1.2),0,7);ctx.strokeStyle=`rgba(255,209,102,${1-k})`;ctx.lineWidth=4/scale+1;ctx.stroke()}
    ctx.save();ctx.translate(c.x+w/2,c.y+h+bob);ctx.rotate(rot);ctx.scale(c.st==='hidden'?-c.side:c.dir,1);
    ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=6*dpr;ctx.shadowOffsetY=2*dpr;
    ctx.drawImage(c.img,-w/2,-h,w,h);ctx.restore();
  }
  ctx.restore();
}
hideCrit();

round=store.get('ld_round',0);
$('#stageTitle').textContent=elTitle.value;setMode(mode);renderHist();resize();spawn();
requestAnimationFrame(loop);
})();
